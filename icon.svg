<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    
    <!-- Neon Cyan Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Purple Glow -->
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Outer Hexagon Grid Lines (Tactical HUD) -->
  <polygon points="256,40 442,148 442,364 256,472 70,364 70,148" 
           fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="2" />
           
  <!-- Main Glowing Hexagon Shield -->
  <polygon points="256,60 422,156 422,356 256,452 90,356 90,156" 
           fill="none" stroke="#00f0ff" stroke-width="8" filter="url(#glowCyan)" stroke-linejoin="round" />

  <!-- Inner Reticle Circles -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1.5" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1" />

  <!-- S-Rank Level Crosshairs -->
  <path d="M 256,80 L 256,120 M 256,432 L 256,392 M 80,256 L 120,256 M 432,256 L 392,256" 
        stroke="#00f0ff" stroke-width="4" stroke-linecap="round" />

  <!-- Central Hunter Letter "H" (Stylized S-Rank Icon) -->
  <g filter="url(#glowPurple)">
    <path d="M 180,160 L 215,160 L 215,230 L 297,230 L 297,160 L 332,160 L 332,352 L 297,352 L 297,282 L 215,282 L 215,352 L 180,352 Z" 
          fill="#a855f7" />
    <polygon points="256,220 262,238 280,238 266,248 271,266 256,256 241,266 246,248 232,238 250,238" 
             fill="#f59e0b" />
  </g>
</svg>
